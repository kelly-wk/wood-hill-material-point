[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wood-hill-material-point"
version = "0.1.0"
description = "Validated-prototype M0 Hill orthotropic elastoplastic material-point solver"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy==2.0.2"]

[tool.setuptools.packages.find]
include = ["wood_hill*"]
